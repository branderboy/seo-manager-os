# Continuous integration. Section 6 of WORLD_CLASS_APP_THESIS.md.
#
# Adapted from the delivery standard's ci.yml to the stack this repository runs. The web
# application still has no server of its own, so there is no integration job over routes
# and jobs yet. The authorization job below is real: it applies the migrations in
# supabase/migrations/ to a live Postgres and tries to cross the tenant boundary.
# docs/production/WORKFLOW-RISK-REGISTER.md records what else has to come back when the
# application itself starts talking to that database.
name: CI

on:
  pull_request:
  push:
    branches: [claude/app-identification-repo-64akmz, main]

jobs:
  checks:
    name: Lint, types, build, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        # Next.js 16 removed `next lint`; ESLint runs directly against eslint.config.mjs.
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Check the client bundle for server only values
        # The static export in out/ is the entire client bundle. Every byte reaches the
        # browser, so this is the only boundary this application has.
        run: bash .github/scripts/check-client-bundle.sh out

  authorization:
    name: Tenant isolation and authorization
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://app_test:app_test@127.0.0.1:5432/lgos_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply the migrations, the seed and the two tenant fixture
        # The migrations under supabase/migrations/ are executed here, not merely stored.
        run: npm run db:test:setup
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Tenant isolation and authorization tests
        # ORG-001 acceptance criteria. These block release.
        # Never add continue-on-error to this step.
        run: npm run test:authz
